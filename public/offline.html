<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · Pokedex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 24px;
      background: linear-gradient(160deg, #2EC6FE 0%, #8936FF 100%);
      text-align: center;
      color: #fff;
    }

    .pokeball {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.25));
      animation: shake 2.4s ease-in-out infinite;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      8% { transform: rotate(-8deg); }
      16% { transform: rotate(8deg); }
      24% { transform: rotate(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pokeball {
        animation: none;
      }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p {
      max-width: 320px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.85);
    }

    button {
      margin-top: 8px;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #8936FF;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <svg class="pokeball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#222" stroke-width="4"/>
    <path d="M4 50a46 46 0 0 1 92 0z" fill="#e63946" stroke="#222" stroke-width="4"/>
    <rect x="4" y="47" width="92" height="6" fill="#222"/>
    <circle cx="50" cy="50" r="14" fill="#fff" stroke="#222" stroke-width="4"/>
    <circle cx="50" cy="50" r="6" fill="#fff" stroke="#222" stroke-width="3"/>
  </svg>

  <h1>Geen verbinding</h1>
  <p>Deze Pokémon is voor nu ontsnapt. Controleer je internetverbinding en probeer het opnieuw.</p>

  <button onclick="window.location.reload()">Opnieuw proberen</button>
</body>
</html>
